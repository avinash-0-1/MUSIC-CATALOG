spring.application.name=WellfoundBackend
# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/music_catalog
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=always

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# (Optional) Specify PostgreSQL dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

logging.level.org.springframework.jdbc.datasource.init=INFO

